name: PixelTools CI

on:
  push:
    branches: [main, work/pdf-merge-split]
  pull_request:
    branches: [main, work/release-readiness-audit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixeltools-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve and lock dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript checks
        run: npm run typecheck
      - name: Automated tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Preserve generated dependency lockfile
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pixeltools-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated lockfile to the PDF tools branch
        if: success() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/pdf-merge-split') || (github.event_name == 'push' && github.ref == 'refs/heads/work/pdf-merge-split'))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock PDF processing dependencies"
            git push origin "HEAD:work/pdf-merge-split"
          fi
      - name: Preserve production build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pixeltools-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
